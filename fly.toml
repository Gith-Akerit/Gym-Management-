# Fly.io: HTTPS and a certificate come with the hostname, and it is one of the
# few small hosts that gives a real persistent disk, which this app needs
# because the whole database is one SQLite file.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create gym_data --size 1 --region sin
#   fly secrets set CARD_SIGNING_SECRET=... ADMIN_EMAIL=... ADMIN_PASSWORD=...
#   fly deploy
app = "gym-management-pilot"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  DATABASE_PATH = "/data/gym.sqlite"
  SLIP_STORAGE_PATH = "/data/slips"
  # Fly's edge proxy is the single hop in front of the app.
  TRUST_PROXY = "1"

[[mounts]]
  source = "gym_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # A second machine would be a second copy of the database fighting the first
  # for its write lock. One machine, always on: a member arriving at 06:00 must
  # not wait for a cold start to open the door.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
