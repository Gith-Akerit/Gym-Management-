# /etc/nginx/sites-available/gym — the alternative to Caddy when nginx is
# already on the box. Get the certificate with:
#
#   certbot --nginx -d app.example.com
#
# which rewrites the listen/ssl lines below for you and sets up renewal.
server {
    listen 80;
    server_name app.example.com;
    # certbot replaces this with a redirect to https once the certificate is in.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name app.example.com;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    # A slip photo off a phone camera is routinely several megabytes. The app
    # enforces its own limit and answers in Thai; this only has to be above it,
    # or nginx rejects the upload first with an English 413.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # TRUST_PROXY=1 makes the app read the address below as the caller, so
        # per-IP budgets apply to members and not to this proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
